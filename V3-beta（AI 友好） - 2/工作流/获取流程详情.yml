info:
  name: 获取流程详情
  type: http
  seq: 2
  tags:
    - 工作流

http:
  method: GET
  url: "{{baseUrl}}/v3/app/workflow/processes/:process_id"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: process_id
      value: ""
      type: path
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/workflow/processes/:process_id"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: process_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

