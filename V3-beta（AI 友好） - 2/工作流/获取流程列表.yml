info:
  name: 获取流程列表
  type: http
  seq: 1
  tags:
    - 工作流

http:
  method: GET
  url: "{{baseUrl}}/v3/app/workflow/processes"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/workflow/processes"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取应用下工作流列表
