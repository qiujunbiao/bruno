info:
  name: 新建工作表
  type: http
  seq: 2
  tags:
    - 工作表

http:
  method: POST
  url: "{{baseUrl}}/v3/app/worksheets"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "name": "测试新建工作表",
        "sectionId": "",
        "fields": [
          {
            "name": "文本",
            "alias": "",
            "type": "2",
            "required": true,
            "isTitle": true
          },
          {
            "name": "数值",
            "alias": "",
            "type": "6",
            "precision": 2,
            "required": true
          },
          {
            "name": "单选",
            "alias": "",
            "type": "11",
            "options": [
              {
                "value": "选项名称1",
                "index": 1
              },
              {
                "value": "选项名称2",
                "index": 2
              }
            ],
            "required": true
          }
        ]
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "name": "测试新建工作表",
            "sectionId": "",
            "fields": [
              {
                "name": "文本",
                "alias": "",
                "type": "2",
                "required": true,
                "isTitle": true
              },
              {
                "name": "数值",
                "alias": "",
                "type": "6",
                "precision": 2,
                "required": true
              },
              {
                "name": "单选",
                "alias": "",
                "type": "11",
                "options": [
                  {
                    "value": "选项名称1",
                    "index": 1
                  },
                  {
                    "value": "选项名称2",
                    "index": 2
                  }
                ],
                "required": true
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 创建工作表，目前支持字段类型有Text|Number|SingleSelect|MultipleSelect|Date|DateTime|Collaborator|Relation|Attachment
