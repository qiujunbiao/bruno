info:
  name: 获取记录分享链接
  type: http
  seq: 11
  tags:
    - 工作表行记录

http:
  method: POST
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id/share-link"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "visibleFields": [
          ""
        ],
        "expiredIn": 0,
        "password": ""
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id/share-link"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: worksheet_id
          value: ""
          type: path
        - name: row_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "visibleFields": [
              ""
            ],
            "expiredIn": 0,
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

