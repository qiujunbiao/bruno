info:
  name: 获取行记录日志
  type: http
  seq: 12
  tags:
    - 工作表行记录

http:
  method: GET
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id/logs"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
    - name: operatorIds
      value: ""
      type: query
      description: 操作者ID数组
      disabled: true
    - name: field
      value: ""
      type: query
      description: 字段ID/别名
      disabled: true
    - name: pageSize
      value: ""
      type: query
      description: 每页数量
      disabled: true
    - name: pageIndex
      value: ""
      type: query
      description: 页码
      disabled: true
    - name: startDate
      value: ""
      type: query
      description: 开始日期 (格式：yyyy-MM-dd HH:mm:ss)
      disabled: true
    - name: endDate
      value: ""
      type: query
      description: 结束日期 (格式：yyyy-MM-dd HH:mm:ss)
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

