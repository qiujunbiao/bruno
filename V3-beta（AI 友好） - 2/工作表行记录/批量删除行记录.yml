info:
  name: 批量删除行记录
  type: http
  seq: 8
  tags:
    - 工作表行记录

http:
  method: DELETE
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/batch"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "rowIds": [
          "row1",
          "row2",
          "row3"
        ],
        "triggerWorkflow": true,
        "permanent": false
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/batch"
      method: DELETE
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: worksheet_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "rowIds": [
              "row1",
              "row2",
              "row3"
            ],
            "triggerWorkflow": true,
            "permanent": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

