info:
  name: 获取关联记录
  type: http
  seq: 9
  tags:
    - 工作表行记录

http:
  method: GET
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id/relations/:field"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
    - name: field
      value: ""
      type: path
    - name: pageSize
      value: ""
      type: query
      description: 每页数量
      disabled: true
    - name: pageIndex
      value: ""
      type: query
      description: 页码
      disabled: true
    - name: isReturnSystemFields
      value: ""
      type: query
      description: 是否获取系统字段
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id/relations/:field"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: worksheet_id
          value: ""
          type: path
        - name: row_id
          value: ""
          type: path
        - name: field
          value: ""
          type: path
        - name: pageSize
          value: ""
          type: query
          description: 每页数量
          disabled: true
        - name: pageIndex
          value: ""
          type: query
          description: 页码
          disabled: true
        - name: isReturnSystemFields
          value: ""
          type: query
          description: 是否获取系统字段
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取关联记录列表，包括关联记录来源工作表信息，行记录信息，行记录详细信息，创建者信息
