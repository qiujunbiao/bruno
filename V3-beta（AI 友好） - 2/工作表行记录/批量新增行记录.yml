info:
  name: 批量新增行记录
  type: http
  seq: 6
  tags:
    - 工作表行记录

http:
  method: POST
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/batch"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "rows": [
          {
            "fields": [
              {
                "id": "field1",
                "value": "值1"
              },
              {
                "id": "field2",
                "value": "值2"
              }
            ]
          },
          {
            "fields": [
              {
                "id": "field1",
                "value": "值3"
              },
              {
                "id": "field2",
                "value": "值4"
              }
            ]
          }
        ],
        "triggerWorkflow": true
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

