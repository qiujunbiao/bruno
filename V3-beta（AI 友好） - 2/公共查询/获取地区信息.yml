info:
  name: 获取地区信息
  type: http
  seq: 3
  tags:
    - 公共查询

http:
  method: GET
  url: "{{baseUrl}}/v3/regions"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: query
      description: 地区ID，不传则返回顶级地区列表
      disabled: true
    - name: search
      value: ""
      type: query
      description: 模糊搜索内容，搜索地区名称
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/regions"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: query
          description: 地区ID，不传则返回顶级地区列表
          disabled: true
        - name: search
          value: ""
          type: query
          description: 模糊搜索内容，搜索地区名称
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |
  获取地区信息，支持按ID查询或模糊搜索
