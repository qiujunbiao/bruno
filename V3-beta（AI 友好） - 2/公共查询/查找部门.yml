info:
  name: 查找部门
  type: http
  seq: 2
  tags:
    - 公共查询

http:
  method: GET
  url: "{{baseUrl}}/v3/departments/lookup"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: name
      value: ""
      type: query
      description: 部门名称（精准匹配）
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/departments/lookup"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: name
          value: ""
          type: query
          description: 部门名称（精准匹配）
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 根据输入的部门名称匹配部门，返回部门 ID 和名称。
