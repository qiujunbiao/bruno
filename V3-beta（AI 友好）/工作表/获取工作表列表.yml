info:
  name: 获取工作表列表
  type: http
  seq: 1
  tags:
    - 工作表

http:
  method: POST
  url: "{{baseUrl}}/v3/app/worksheets/list"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "responseFormat": "",
        "worksheets": [
          ""
        ]
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/list"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "responseFormat": "",
            "worksheets": [
              ""
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取应用下的所有工作表或者指定的工作表列表
