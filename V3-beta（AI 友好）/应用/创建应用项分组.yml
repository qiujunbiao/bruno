info:
  name: 创建应用项分组
  type: http
  seq: 2
  tags:
    - 应用

http:
  method: POST
  url: "{{baseUrl}}/v3/app/sections/batchCreate"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  body:
    type: json
    data: |-
      {
        "parentId": "",
        "sections": [
          {
            "icon": "8_4_folder",
            "name": "测试新增的分组"
          }
        ]
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/sections/batchCreate"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      body:
        type: json
        data: |-
          {
            "parentId": "",
            "sections": [
              {
                "icon": "8_4_folder",
                "name": "测试新增的分组"
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 批量创建应用项分组，用于对应用下的工作表和自定义页面进行归组展示
