info:
  name: 获取应用信息
  type: http
  seq: 1
  tags:
    - 应用

http:
  method: GET
  url: "{{baseUrl}}/v3/app"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

runtime:
  variables:
    - name: baseUrl
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取应用信息，包含应用下分组、工作表、自定义页面信息
