info:
  name: 查找成员
  type: http
  seq: 1
  tags:
    - 公共查询

http:
  method: GET
  url: "{{baseUrl}}/v3/users/lookup"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: name
      value: ""
      type: query
      description: 人员名称（精准匹配）
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/users/lookup"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      params:
        - name: name
          value: ""
          type: query
          description: 人员名称（精准匹配）
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 根据输入的人员名称匹配用户，返回用户 ID、姓名、已脱敏的手机号和邮箱。
