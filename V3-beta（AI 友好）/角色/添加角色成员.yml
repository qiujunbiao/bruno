info:
  name: 添加角色成员
  type: http
  seq: 5
  tags:
    - 角色

http:
  method: POST
  url: "{{baseUrl}}/v3/app/roles/:role_id/members"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: role_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "userIds": [
          "user123",
          "user456"
        ],
        "departmentIds": [
          "dept123"
        ],
        "departmentTreeIds": [
          "deptTree123"
        ],
        "jobIds": [
          "job123",
          "job456"
        ],
        "projectOrganizeIds": [
          "org123"
        ]
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

