info:
  name: 触发流程
  type: http
  seq: 3
  tags:
    - 工作流

http:
  method: POST
  url: "{{baseUrl}}/v3/app/workflow/hooks/:process_id"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: process_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "text_field": "日报",
        "number_field": 100,
        "checkbox_field": 1,
        "datetime_field": "2025-07-16 15:20",
        "radio_field": "选项B",
        "array_field": [
          "item1",
          "item2"
        ],
        "object_array_field": [
          {
            "key": "A",
            "value": 1
          },
          {
            "key": "B",
            "value": 2
          }
        ],
        "user_field": [
          "user_001"
        ],
        "department_field": [
          "dept_001"
        ],
        "role_field": [
          "role_leader"
        ],
        "file_field": [
          "https://example.com/input/file1.pdf"
        ]
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

