info:
  name: 获取行记录详情
  type: http
  seq: 2
  tags:
    - 工作表行记录

http:
  method: GET
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
    - name: includeSystemFields
      value: ""
      type: query
      description: 是否获取系统字段
      disabled: true
    - name: responseFormat
      value: ""
      type: query
      description: 响应格式：json - 返回 JSON，md - 返回 Markdown 文本(更省 token，返回工作表结构+记录详情)
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      params:
        - name: worksheet_id
          value: ""
          type: path
        - name: row_id
          value: ""
          type: path
        - name: includeSystemFields
          value: ""
          type: query
          description: 是否获取系统字段
          disabled: true
        - name: responseFormat
          value: ""
          type: query
          description: 响应格式：json - 返回 JSON，md - 返回 Markdown 文本(更省 token，返回工作表结构+记录详情)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取记录详情信息，包括创建者、拥有者、字段信息、根据字段数据类型生成示例值
