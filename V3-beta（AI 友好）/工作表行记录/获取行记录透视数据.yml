info:
  name: 获取行记录透视数据
  type: http
  seq: 10
  tags:
    - 工作表行记录

http:
  method: POST
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/pivot"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: worksheet_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "pageSize": 0,
        "pageIndex": 0,
        "viewId": "",
        "columns": [
          {}
        ],
        "rows": [
          {
            "field": "",
            "displayName": "",
            "granularity": 0,
            "includeEmpty": false
          }
        ],
        "values": [
          {
            "field": "",
            "displayName": "",
            "aggregation": "",
            "includeEmpty": false
          }
        ],
        "filter": null,
        "sorts": [
          {
            "field": "",
            "isAsc": false
          }
        ],
        "includeSummary": false
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

