      params:
        - name: worksheet_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "pageSize": 0,
            "pageIndex": 0,
            "viewId": "",
            "columns": [
              {}
            ],
            "rows": [
              {
                "field": "",
                "displayName": "",
                "granularity": 0,
                "includeEmpty": false
              }
            ],
            "values": [
              {
                "field": "",
                "displayName": "",
                "aggregation": "",
                "includeEmpty": false
              }
            ],
            "filter": null,
            "sorts": [
              {
                "field": "",
                "isAsc": false
              }
            ],
            "includeSummary": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
