info:
  name: 获取行记录讨论
  type: http
  seq: 13
  tags:
    - 工作表行记录

http:
  method: GET
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id/discussions"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
    - name: pageIndex
      value: ""
      type: query
      description: 页码
      disabled: true
    - name: pageSize
      value: ""
      type: query
      description: 每页大小
      disabled: true
    - name: search
      value: ""
      type: query
      description: 搜索关键词
      disabled: true
    - name: onlyWithAttachments
      value: ""
      type: query
      description: 是否只返回包含附件的讨论
      disabled: true
    - name: responseFormat
      value: ""
      type: query
      description: 响应格式：json - 返回 JSON，md - 返回 Markdown 文本(更省 token，仅返回部分重要字段)
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

