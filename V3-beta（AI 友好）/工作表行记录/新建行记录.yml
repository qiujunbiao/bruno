info:
  name: 新建行记录
  type: http
  seq: 5
  tags:
    - 工作表行记录

http:
  method: POST
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: worksheet_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "triggerWorkflow": true,
        "fields": [
          {
            "id": "6847f2a1e66b4b2aa67b1467",
            "value": "HHHH"
          }
        ]
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      params:
        - name: worksheet_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "triggerWorkflow": true,
            "fields": [
              {
                "id": "6847f2a1e66b4b2aa67b1467",
                "value": "HHHH"
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

