info:
  name: 批量更新行记录详情
  type: http
  seq: 7
  tags:
    - 工作表行记录

http:
  method: PATCH
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/batch"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: worksheet_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "rowIds": [
          "row1",
          "row2"
        ],
        "fields": [
          {
            "id": "field1",
            "value": "新值1"
          },
          {
            "id": "field2",
            "value": "新值2"
          }
        ],
        "triggerWorkflow": true
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/batch"
      method: PATCH
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      params:
        - name: worksheet_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "rowIds": [
              "row1",
              "row2"
            ],
            "fields": [
              {
                "id": "field1",
                "value": "新值1"
              },
              {
                "id": "field2",
                "value": "新值2"
              }
            ],
            "triggerWorkflow": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

