            "logic": "OR",
            "children": [
              {
                "type": "group",
                "logic": "AND",
                "children": [
                  {
                    "type": "condition",
                    "field": "677b4a73d14fcf3edf4e7f15",
                    "operator": "eq",
                    "value": [
                      "1"
                    ]
                  },
                  {
                    "type": "condition",
                    "field": "677b4a73d14fcf3edf4e7f15",
