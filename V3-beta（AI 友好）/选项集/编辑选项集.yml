info:
  name: 编辑选项集
  type: http
  seq: 3
  tags:
    - 选项集

http:
  method: PUT
  url: "{{baseUrl}}/v3/app/optionsets/:optionset_id"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  params:
    - name: optionset_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "更新后的选项集",
        "options": [
          {
            "key": "key1",
            "value": "更新选项1",
            "index": 1,
            "color": "#FF5722",
            "score": 60
          }
        ],
        "enableColor": true,
        "enableScore": true
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/optionsets/:optionset_id"
      method: PUT
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      params:
        - name: optionset_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "name": "更新后的选项集",
            "options": [
              {
                "key": "key1",
                "value": "更新选项1",
                "index": 1,
                "color": "#FF5722",
                "score": 60
              }
            ],
            "enableColor": true,
            "enableScore": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 编辑选项集
