info:
  name: 获取应用下知识库列表
  type: http
  seq: 1
  tags:
    - 知识库

http:
  method: POST
  url: "{{baseUrl}}/v3/app/knowledge/list"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
      description: HAP应用密钥
  body:
    type: json
    data: |-
      {
        "knowledgeIds": []
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/knowledge/list"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
          description: HAP应用密钥
      body:
        type: json
        data: |-
          {
            "knowledgeIds": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取当前应用下的知识库列表
