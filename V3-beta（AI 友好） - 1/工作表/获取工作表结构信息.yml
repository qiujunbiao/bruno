info:
  name: 获取工作表结构信息
  type: http
  seq: 3
  tags:
    - 工作表

http:
  method: GET
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: responseFormat
      value: ""
      type: query
      description: json：返回 JSON，md：返回 md 文本(更省 token, 仅返回部分重要字段)。默认为 json
      disabled: true
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id"
      method: GET
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: worksheet_id
          value: ""
          type: path
        - name: responseFormat
          value: ""
          type: query
          description: json：返回 JSON，md：返回 md 文本(更省 token, 仅返回部分重要字段)。默认为 json
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取工作表配置及其字段信息
