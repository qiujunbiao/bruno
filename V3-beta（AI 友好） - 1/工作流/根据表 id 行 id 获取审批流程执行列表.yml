info:
  name: 根据表 id 行 id 获取审批流程执行列表
  type: http
  seq: 4
  tags:
    - 工作流

http:
  method: POST
  url: "{{baseUrl}}/v3/app/workflow/:worksheet_id/rows/:row_id/approval/list"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "pageIndex": 0,
        "pageSize": 0,
        "complete": false
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/workflow/:worksheet_id/rows/:row_id/approval/list"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: worksheet_id
          value: ""
          type: path
        - name: row_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "pageIndex": 0,
            "pageSize": 0,
            "complete": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: 获取指定工作表行记录关联的审批流程执行列表，可分页；complete 可筛选未完成/全部
