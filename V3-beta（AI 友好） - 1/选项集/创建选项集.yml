info:
  name: 创建选项集
  type: http
  seq: 2
  tags:
    - 选项集

http:
  method: POST
  url: "{{baseUrl}}/v3/app/optionsets"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "name": "状态选项集",
        "options": [
          {
            "value": "进行中",
            "index": 1,
            "color": "#2196F3",
            "score": 50
          },
          {
            "value": "已完成",
            "index": 2,
            "color": "#4CAF50",
            "score": 100
          }
        ],
        "enableColor": true,
        "enableScore": true
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/optionsets"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "name": "状态选项集",
            "options": [
              {
                "value": "进行中",
                "index": 1,
                "color": "#2196F3",
                "score": 50
              },
              {
                "value": "已完成",
                "index": 2,
                "color": "#4CAF50",
                "score": 100
              }
            ],
            "enableColor": true,
            "enableScore": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |
  创建选项集信息
  数据包括：选项集名称、选项集信息（选项值、排序、颜色、分值）
