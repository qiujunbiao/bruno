info:
  name: 删除行记录
  type: http
  seq: 4
  tags:
    - 工作表行记录

http:
  method: DELETE
  url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  params:
    - name: worksheet_id
      value: ""
      type: path
    - name: row_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "triggerWorkflow": false,
        "permanent": true
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/worksheets/:worksheet_id/rows/:row_id"
      method: DELETE
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      params:
        - name: worksheet_id
          value: ""
          type: path
        - name: row_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "triggerWorkflow": false,
            "permanent": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

