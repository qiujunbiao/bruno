info:
  name: 创建角色
  type: http
  seq: 2
  tags:
    - 角色

http:
  method: POST
  url: "{{baseUrl}}/v3/app/roles"
  headers:
    - name: HAP-Appkey
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "name": "测试角色1",
        "description": "测试创建角色",
        "hideAppForMembers": "false",
        "type": "0",
        "permissionScope": "30"
      }
  auth:
    type: apikey
    key: HAP-Appkey
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/v3/app/roles"
      method: POST
      headers:
        - name: HAP-Appkey
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "name": "测试角色1",
            "description": "测试创建角色",
            "hideAppForMembers": "false",
            "type": "0",
            "permissionScope": "30"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |
  创建角色
  信息包含：角色名称、描述、权限信息
